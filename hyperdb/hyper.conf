# hyper main db settings, installed as <data>/conf.d/hyper.conf by install.sh (loaded after postgresql.conf).
# Sized for a big workstation (32 cores, 512 GB RAM, SSD); lower shared_buffers/effective_cache_size on a
# small machine. shared_buffers and max_worker_processes need a restart, the rest a reload.

# Server-level settings the code depends on (were docker-compose.yml `command:`)
max_connections = 1000                 # test ctxs hold one connection each
max_locks_per_transaction = 256        # "out of shared memory" at the default 64 (15.10)
shared_preload_libraries = 'pg_search,pg_cron,pg_stat_statements'
pg_stat_statements.max = 5000
pg_stat_statements.track = top
track_activity_query_size = 4096

# Memory
shared_buffers = 8GB
effective_cache_size = 64GB
work_mem = 32MB
maintenance_work_mem = 1GB

# Disk / WAL
random_page_cost = 1.1
effective_io_concurrency = 200
max_wal_size = 4GB
min_wal_size = 512MB
checkpoint_completion_target = 0.9
wal_compression = lz4
default_toast_compression = lz4

# Parallelism
max_worker_processes = 16
max_parallel_workers = 16
max_parallel_workers_per_gather = 4
max_parallel_maintenance_workers = 4

# Safety and visibility
idle_in_transaction_session_timeout = 10min
log_min_duration_statement = 1s
log_autovacuum_min_duration = 10s
log_checkpoints = on
log_lock_waits = on
log_temp_files = 64MB

# Local socket: owner only (other users on the machine must not reach the db)
unix_socket_permissions = 0700
